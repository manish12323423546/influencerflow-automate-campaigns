<!DOCTYPE html>
<html>
<head>
    <title>Clearing Cache - CopilotKit Fix</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            background: rgba(0,0,0,0.2);
            padding: 40px;
            border-radius: 10px;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Fixing CopilotKit Configuration</h1>
        <div class="spinner"></div>
        <p>Clearing browser cache and fixing remote URL issue...</p>
        <p><small>This will redirect to your app in a moment</small></p>
    </div>

    <script>
        console.log('🚨 COPILOTKIT CACHE FIX STARTED');
        console.log('🔄 Clearing all caches to fix remote URL issue...');
        
        // Clear service workers
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                    console.log('🗑️ Unregistered service worker');
                }
            });
        }
        
        // Clear all caches
        if ('caches' in window) {
            caches.keys().then(function(names) {
                for (let name of names) {
                    caches.delete(name);
                    console.log('🗑️ Cleared cache:', name);
                }
            });
        }
        
        // Clear storage
        try {
            localStorage.clear();
            sessionStorage.clear();
            console.log('🗑️ Cleared local storage');
        } catch (e) {
            console.log('⚠️ Could not clear storage:', e);
        }
        
        // Clear IndexedDB
        if ('indexedDB' in window) {
            try {
                indexedDB.databases().then(dbs => {
                    dbs.forEach(db => {
                        if (db.name) {
                            indexedDB.deleteDatabase(db.name);
                            console.log('🗑️ Cleared IndexedDB:', db.name);
                        }
                    });
                });
            } catch (e) {
                console.log('⚠️ Could not clear IndexedDB:', e);
            }
        }
        
        // Redirect after clearing
        setTimeout(() => {
            console.log('✅ Cache cleared, redirecting to main app...');
            window.location.href = 'http://localhost:5173';
        }, 3000);
    </script>
</body>
</html>
