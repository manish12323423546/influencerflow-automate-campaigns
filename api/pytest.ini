[tool:pytest]
# Pytest configuration for AI Agents API tests

# Test discovery
testpaths = .
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --cov=ai_agents
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    websocket: marks tests that use WebSocket connections
    workflow: marks tests that test workflow execution
    ceo: marks tests specific to CEO agent functionality

# Async support
asyncio_mode = auto

# Minimum version
minversion = 6.0

# Test session timeout (in seconds)
timeout = 300

# Parallel execution
# Run with: pytest -n auto
# Requires pytest-xdist 